services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cavora_mongo_data:/data/db

  mongo-test:
    image: mongo:7
    ports:
      - '27018:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data/db

volumes:
  cavora_mongo_data:
