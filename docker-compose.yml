services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'cavora-dev', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { quit(rs.status().ok === 1 ? 0 : 1) } catch (error) { quit(1) }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cavora_mongo_data:/data/db

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    restart: 'no'
    entrypoint: ['/bin/bash', '-c']
    command:
      - >
        until mongosh --host mongo:27017 --quiet --eval "db.adminCommand('ping').ok";
        do sleep 1; done;
        mongosh --host mongo:27017 --quiet --eval
        "try { rs.status() } catch (error) {
        rs.initiate({_id:'cavora-dev',members:[{_id:0,host:'mongo:27017'}]}) }"

volumes:
  cavora_mongo_data:
